# NoSQL Knowledge Graph Project - Complete Docker Setup
# Includes: MongoDB, Kafka, Zookeeper, and the NoSQL application
version: "3.8"

services:
  # Zookeeper for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nosql_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - nosql-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Kafka message broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nosql_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CREATE_TOPICS: 'raw_papers:1:1'
    networks:
      - nosql-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 45s

  # MongoDB (local development - for Atlas, this won't be used)
  mongo:
    image: mongo:6.0
    container_name: nosql_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: nosql_kg
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init-scripts:/docker-entrypoint-initdb.d:ro
    command: >
      --bind_ip_all
    networks:
      - nosql-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MongoDB Express (GUI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: nosql_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
    ports:
      - "8081:8081"
    networks:
      - nosql-network

  # Kafka Producer (fetches papers from APIs)
  kafka-producer:
    build: .
    container_name: nosql_kafka_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_RAW_TOPIC=raw_papers
      - PYTHONPATH=/app
    command: ["python", "ingestion/kafka_producer.py"]
    networks:
      - nosql-network
    restart: unless-stopped

  # Kafka Consumer (processes papers and builds KG)
  kafka-consumer:
    build: .
    container_name: nosql_kafka_consumer
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_RAW_TOPIC=raw_papers
      - MONGODB_URI=mongodb://root:example@mongo:27017/NOSQL?authSource=admin&retryWrites=true&w=majority
      - MONGODB_DB=NOSQL
    command: ["python", "ingestion/kafka_consumer_kg.py"]
    networks:
      - nosql-network
    restart: unless-stopped

  # Main NoSQL Application (Streamlit Dashboard + KG Builder)
  nosql-app:
    build: .
    container_name: nosql_main_app
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - MONGODB_URI=mongodb://root:example@mongo:27017/NOSQL?authSource=admin&retryWrites=true&w=majority
      - MONGODB_DB=NOSQL
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    command: ["python", "pipeline_runner.py"]
    networks:
      - nosql-network
    volumes:
      - .:/app
    restart: unless-stopped

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nosql_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - nosql-network

volumes:
  mongo_data:
    name: nosql_mongo_data

networks:
  nosql-network:
    driver: bridge
